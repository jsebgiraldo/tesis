# ============================================================================
# AMI Thread + LwM2M Node — Zephyr Kconfig
# Target: ESP32-C6-DevKitC-1
# ============================================================================

# --- General ---
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y
CONFIG_SHELL=y
CONFIG_ASSERT=y
CONFIG_REBOOT=y
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# --- Networking (IPv6 over Thread) ---
CONFIG_NETWORKING=y
CONFIG_NET_IPV6=y
CONFIG_NET_IPV4=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_MAX_CONTEXTS=10
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_IF_UNICAST_IPV6_ADDR_COUNT=6
CONFIG_NET_IF_MCAST_IPV6_ADDR_COUNT=8
CONFIG_NET_L2_OPENTHREAD=y
# CONFIG_NET_CONFIG_NEED_IPV6 removed in v4.2.0

# --- OpenThread ---
CONFIG_OPENTHREAD=y
CONFIG_OPENTHREAD_FTD=y
CONFIG_OPENTHREAD_SHELL=y
CONFIG_OPENTHREAD_NETWORK_NAME="AMI-Pilot-2025"
CONFIG_OPENTHREAD_CHANNEL=25
CONFIG_OPENTHREAD_PANID=43981
CONFIG_OPENTHREAD_XPANID="12:34:56:78:90:AB:CD:EF"
CONFIG_OPENTHREAD_NETWORKKEY="00:11:22:33:44:55:66:77:88:99:AA:BB:CC:DD:EE:FF"
CONFIG_OPENTHREAD_JOINER=y
CONFIG_OPENTHREAD_COMMISSIONER=n
CONFIG_OPENTHREAD_DNS_CLIENT=y
CONFIG_OPENTHREAD_SRP_CLIENT=y
CONFIG_OPENTHREAD_COAP=y
CONFIG_OPENTHREAD_MTD_SED=n

# Thread security (via mbedTLS, auto-enabled by OpenThread)
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y

# --- LwM2M Client ---
CONFIG_LWM2M=y
CONFIG_LWM2M_ENGINE_MAX_OBSERVER=10
CONFIG_LWM2M_ENGINE_MAX_MESSAGES=10
CONFIG_LWM2M_ENGINE_MAX_PENDING=10
CONFIG_LWM2M_ENGINE_MAX_REPLIES=10
CONFIG_LWM2M_ENGINE_STACK_SIZE=4096
CONFIG_LWM2M_ENGINE_DEFAULT_LIFETIME=300
CONFIG_LWM2M_COAP_BLOCK_SIZE=256
# LwM2M Objects
CONFIG_LWM2M_CONN_MON_OBJ_SUPPORT=y
CONFIG_LWM2M_IPSO_SUPPORT=y
CONFIG_LWM2M_IPSO_VOLTAGE_SENSOR=y
CONFIG_LWM2M_IPSO_GENERIC_SENSOR=y
CONFIG_LWM2M_IPSO_CURRENT_SENSOR=y

# LwM2M security (NoSec for now, DTLS optional)
# CONFIG_LWM2M_DTLS_SUPPORT=y

# --- CoAP ---
CONFIG_COAP=y

# --- UART (RS-485 para medidores) ---
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# --- GPIO (tamper detection, RS-485 DE/RE) ---
CONFIG_GPIO=y

# --- Power Management ---
CONFIG_PM=y
CONFIG_PM_DEVICE=y

# --- Flash & NVS (persistent storage) ---
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# --- Watchdog ---
CONFIG_WATCHDOG=y
CONFIG_WDT_DISABLE_AT_BOOT=n

# --- Debug (desactivar en producción) ---
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_NAME=y

# --- Floating point printf support ---
CONFIG_CBPRINTF_FP_SUPPORT=y
