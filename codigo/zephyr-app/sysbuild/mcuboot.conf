# ============================================================================
# MCUboot configuration for AMI ESP32-C6 OTA
# ============================================================================

# Log level (WRN to minimize boot time)
CONFIG_MCUBOOT_LOG_LEVEL_WRN=y

# Prevent downgrade attacks (only allow newer versions)
CONFIG_MCUBOOT_DOWNGRADE_PREVENTION=y

# Serial recovery disabled (OTA only, no USB recovery)
CONFIG_MCUBOOT_SERIAL=n
