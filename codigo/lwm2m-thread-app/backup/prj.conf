# ============================================================================
# AMI LwM2M Client over OpenThread — prj.conf
# Target: XIAO ESP32-C6 (Seeed Studio)
#
# Based on Zephyr samples/net/lwm2m_client with overlay-ot.conf
# ============================================================================

# --- General ---
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BACKEND_UART=y
CONFIG_PRINTK=y
CONFIG_SHELL=y
CONFIG_ASSERT=y
CONFIG_REBOOT=y
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_BOOT_DELAY=1000

# --- Networking (IPv6-only over Thread) ---
CONFIG_NETWORKING=y
CONFIG_NET_IPV6=y
CONFIG_NET_IPV4=n
CONFIG_NET_TCP=n
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_MAX_CONTEXTS=5
CONFIG_NET_PKT_RX_COUNT=10
CONFIG_NET_PKT_TX_COUNT=10
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=16
CONFIG_NET_IF_UNICAST_IPV6_ADDR_COUNT=6
CONFIG_NET_IF_MCAST_IPV6_ADDR_COUNT=8
CONFIG_NET_IPV6_NBR_CACHE=n
CONFIG_NET_IPV6_MLD=n

# --- Connection Manager (handles L4 up/down events) ---
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV6=y
CONFIG_NET_CONFIG_NEED_IPV4=n
CONFIG_NET_CONFIG_MY_IPV4_ADDR=""
CONFIG_NET_CONFIG_PEER_IPV4_ADDR=""
# Server address — use mesh-local prefix
CONFIG_NET_SAMPLE_LWM2M_SERVER="coap://[fdde:ad00:beef::2]:5683"

# --- OpenThread (FTD) ---
CONFIG_NET_L2_OPENTHREAD=y
CONFIG_OPENTHREAD=y
CONFIG_OPENTHREAD_FTD=y
CONFIG_OPENTHREAD_SHELL=y
CONFIG_OPENTHREAD_CHANNEL=25
CONFIG_OPENTHREAD_PANID=43981
CONFIG_OPENTHREAD_XPANID="12:34:56:78:90:AB:CD:EF"
CONFIG_OPENTHREAD_NETWORKKEY="00:11:22:33:44:55:66:77:88:99:AA:BB:CC:DD:EE:FF"
CONFIG_OPENTHREAD_NETWORK_NAME="AMI-Pilot-2025"
CONFIG_OPENTHREAD_JOINER=y
CONFIG_OPENTHREAD_DNS_CLIENT=y
CONFIG_OPENTHREAD_SRP_CLIENT=y
CONFIG_OPENTHREAD_COAP=y
CONFIG_OPENTHREAD_DEFAULT_TX_POWER=8
CONFIG_OPENTHREAD_THREAD_VERSION_1_3=y

CONFIG_OPENTHREAD_DEBUG=y
CONFIG_OPENTHREAD_L2_DEBUG=y
CONFIG_OPENTHREAD_L2_LOG_LEVEL_INF=y

# Shell stack for OT shell
CONFIG_SHELL_STACK_SIZE=3072

# --- mbedTLS ---
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=768

# --- LwM2M Client ---
CONFIG_LWM2M=y
CONFIG_LWM2M_LOG_LEVEL_INF=y
CONFIG_LWM2M_COAP_BLOCK_SIZE=512
CONFIG_LWM2M_SHELL=y
CONFIG_LWM2M_ENGINE_MAX_OBSERVER=10
CONFIG_LWM2M_ENGINE_MAX_MESSAGES=10
CONFIG_LWM2M_ENGINE_MAX_PENDING=10
CONFIG_LWM2M_ENGINE_MAX_REPLIES=10
CONFIG_LWM2M_ENGINE_STACK_SIZE=4096
CONFIG_LWM2M_ENGINE_DEFAULT_LIFETIME=300

# LwM2M IPSO objects
CONFIG_LWM2M_IPSO_SUPPORT=y
CONFIG_LWM2M_IPSO_TEMP_SENSOR=y
CONFIG_LWM2M_IPSO_VOLTAGE_SENSOR=y
CONFIG_LWM2M_IPSO_CURRENT_SENSOR=y
CONFIG_LWM2M_IPSO_GENERIC_SENSOR=y
CONFIG_LWM2M_IPSO_GENERIC_SENSOR_INSTANCE_COUNT=2
CONFIG_LWM2M_IPSO_LIGHT_CONTROL=y
CONFIG_LWM2M_CONN_MON_OBJ_SUPPORT=y

# LwM2M Firmware Update Object (ID 5)
CONFIG_LWM2M_FIRMWARE_UPDATE_OBJ_SUPPORT=y
CONFIG_LWM2M_FIRMWARE_UPDATE_PULL_SUPPORT=y

# CoAP extended options for long endpoints
CONFIG_COAP=y
CONFIG_COAP_EXTENDED_OPTIONS_LEN=y
CONFIG_COAP_EXTENDED_OPTIONS_LEN_VALUE=40

# --- NVS (persistent storage) ---
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# --- GPIO (LED, tamper) ---
CONFIG_GPIO=y

# --- Serial (USB console + RS-485) ---
CONFIG_SERIAL=y
CONFIG_SERIAL_ESP32_USB=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# --- Watchdog (disabled at boot — Thread init can take >30s) ---
CONFIG_WATCHDOG=y
CONFIG_WDT_DISABLE_AT_BOOT=y

# --- Random ---
CONFIG_TEST_RANDOM_GENERATOR=y

# --- MCUboot + FOTA ---
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_IMG_ENABLE_IMAGE_CHECK=y
CONFIG_IMG_BLOCK_BUF_SIZE=512
CONFIG_STREAM_FLASH=y

# --- Debug ---
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_NAME=y
CONFIG_EXCEPTION_STACK_TRACE=y
CONFIG_FAULT_DUMP=2
CONFIG_EXTRA_EXCEPTION_INFO=y
CONFIG_EARLY_CONSOLE=y
CONFIG_IEEE802154_DRIVER_LOG_LEVEL_WRN=y

# --- Floating point printf ---
CONFIG_CBPRINTF_FP_SUPPORT=y
